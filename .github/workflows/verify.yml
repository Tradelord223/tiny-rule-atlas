name: Verify atlas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Independent simulator and regression checks
        run: python -m unittest discover -s tests -v
      - name: Recalculate and verify all experiments
        run: python atlas.py verify
      - name: Validate browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --input-type=module --check < assets/laboratory.js
      - name: Laboratory parity, perturbation, and traffic checks
        run: node --test tests/lab-core.test.mjs
      - name: Static pages, local assets, and section anchors
        run: python scripts/check_site.py
